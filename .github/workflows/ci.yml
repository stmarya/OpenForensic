name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Lint & Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer & Pester
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Install-Module Pester -MinimumVersion 5.3.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Validate tools.json
        shell: powershell
        run: |
          $catalog = Get-Content -LiteralPath .\tools.json -Raw | ConvertFrom-Json
          if (-not $catalog.tools) { throw 'tools.json tidak memuat entri tools' }
          Write-Host "tools.json valid: $($catalog.tools.Count) tool"

      - name: Validate module manifest
        shell: powershell
        run: Test-ModuleManifest -Path .\OpenForensic.psd1 | Format-List Name, Version, PowerShellVersion

      - name: PSScriptAnalyzer (errors are blocking)
        shell: powershell
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings .\PSScriptAnalyzerSettings.psd1
          $results | Sort-Object Severity, ScriptName, Line | Format-Table -AutoSize Severity, ScriptName, Line, RuleName, Message
          $errors = @($results | Where-Object { $_.Severity -eq 'Error' })
          if ($errors.Count -gt 0) { throw "PSScriptAnalyzer menemukan $($errors.Count) error" }
          Write-Host "Tidak ada error. Warning: $(@($results | Where-Object { $_.Severity -eq 'Warning' }).Count)"

      - name: Guard - tidak boleh ada Invoke-Expression
        shell: powershell
        run: |
          $hits = Select-String -Path .\*.ps1, .\*.psm1 -Pattern 'Invoke-Expression|(?<![\w-])iex(?![\w-])' -ErrorAction SilentlyContinue
          if ($hits) { $hits | Format-List; throw 'Invoke-Expression terdeteksi - dilarang oleh kebijakan keamanan.' }
          Write-Host 'Bersih: tidak ada Invoke-Expression.'

      - name: Pester
        shell: powershell
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = '.\tests'
          $config.Run.Throw = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'TestResults.xml'
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: TestResults.xml
          if-no-files-found: ignore
