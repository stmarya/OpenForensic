name: Lint

# Workflow ini fokus pada analisis statis, validasi katalog/manifest, dan guard
# portabilitas. Eksekusi Pester dilakukan oleh workflow cross-platform.yml pada
# matriks Windows PowerShell 5.1, Windows pwsh, Linux, dan macOS agar tidak ganda.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Lint & Guard
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Validate tools.json
        shell: powershell
        run: |
          $catalog = Get-Content -LiteralPath .\tools.json -Raw | ConvertFrom-Json
          if (-not $catalog.tools) { throw 'tools.json tidak memuat entri tools' }
          $ids = @($catalog.tools | ForEach-Object { $_.id })
          $duplicates = @($ids | Group-Object | Where-Object { $_.Count -gt 1 })
          if ($duplicates.Count -gt 0) { throw "Id tool duplikat: $(($duplicates | ForEach-Object { $_.Name }) -join ', ')" }
          Write-Host "tools.json valid: $($catalog.tools.Count) tool, semua id unik"

      - name: Validate module manifest
        shell: powershell
        run: Test-ModuleManifest -Path .\OpenForensic.psd1 | Format-List Name, Version, PowerShellVersion

      - name: PSScriptAnalyzer (errors are blocking)
        shell: powershell
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings .\PSScriptAnalyzerSettings.psd1
          $results | Sort-Object Severity, ScriptName, Line | Format-Table -AutoSize Severity, ScriptName, Line, RuleName, Message
          $errors = @($results | Where-Object { $_.Severity -eq 'Error' })
          if ($errors.Count -gt 0) { throw "PSScriptAnalyzer menemukan $($errors.Count) error" }
          Write-Host "Tidak ada error. Warning: $(@($results | Where-Object { $_.Severity -eq 'Warning' }).Count)"

      - name: Guard - tidak boleh ada Invoke-Expression (blocking)
        shell: powershell
        run: |
          $hits = Select-String -Path .\*.ps1, .\*.psm1 -Pattern 'Invoke-Expression|(?<![\w-])iex(?![\w-])' -ErrorAction SilentlyContinue
          if ($hits) { $hits | Format-List; throw 'Invoke-Expression terdeteksi - dilarang oleh kebijakan keamanan.' }
          Write-Host 'Bersih: tidak ada Invoke-Expression.'

      # Berkas yang sudah dimigrasi ke lapisan OpenForensic.Platform.psm1 wajib tetap
      # bersih. Pelanggaran di sini memblokir CI agar tidak ada regresi portabilitas.
      - name: Guard - berkas termigrasi wajib bebas pola khusus Windows (blocking)
        shell: powershell
        run: |
          $migrated = @(
            'OpenForensic.psm1',
            'OpenForensic.Workflow.psm1',
            'OpenForensic.Integrity.psm1',
            'OpenForensic.Timeline.psm1',
            'OpenForensic.Models.psm1',
            'menu.ps1',
            'case.ps1',
            'setup_tools.ps1',
            'doctor.ps1'
          )
          $pattern = '\$env:(TEMP|TMP|ComSpec|USERNAME|COMPUTERNAME)\b|\$Is(Windows|Linux|MacOS)\b|[A-Za-z]:\\(Users|Windows|Program Files)'
          $violations = @()
          $checked = @()
          foreach ($file in $migrated) {
            if (-not (Test-Path -LiteralPath $file)) { continue }
            $checked += $file
            $violations += @(Select-String -Path $file -Pattern $pattern)
          }
          Write-Host "Diperiksa: $($checked -join ', ')"
          if ($violations.Count -gt 0) {
            $violations | Format-Table -AutoSize Path, LineNumber, Line
            throw "Berkas termigrasi harus memakai lapisan platform (Test-OFWindows, Get-OFTempDirectory, Get-OFActorName). Ditemukan $($violations.Count) pelanggaran."
          }
          Write-Host 'Bersih: seluruh berkas termigrasi memakai lapisan platform.'

      # Sisa berkas (mis. run.ps1, OpenForensic.Ai.psm1) belum diaudit satu per satu.
      # Dilaporkan sebagai peringatan supaya migrasi berikutnya terlihat, tanpa memblokir.
      - name: Guard - portabilitas berkas sisa (warning)
        shell: powershell
        continue-on-error: true
        run: |
          $migrated = @(
            'OpenForensic.psm1',
            'OpenForensic.Workflow.psm1',
            'OpenForensic.Integrity.psm1',
            'OpenForensic.Timeline.psm1',
            'OpenForensic.Models.psm1',
            'OpenForensic.Platform.psm1',
            'menu.ps1',
            'case.ps1',
            'setup_tools.ps1',
            'doctor.ps1'
          )
          $sources = Get-ChildItem -Path . -Include '*.ps1', '*.psm1' -File -Recurse |
            Where-Object { $_.FullName -notmatch '\\(tests|bin|volatility3)\\' } |
            Where-Object { $migrated -notcontains $_.Name }
          if (-not $sources) {
            Write-Host 'Tidak ada berkas sisa untuk diperiksa.'
            exit 0
          }
          $violations = @()
          $violations += @($sources | Select-String -Pattern '\$Is(Windows|Linux|MacOS)\b')
          $violations += @($sources | Select-String -Pattern '\$env:(TEMP|TMP|ComSpec)\b')
          $violations += @($sources | Select-String -Pattern '[A-Za-z]:\\(Users|Windows|Program Files)')
          if ($violations.Count -gt 0) {
            $violations | Format-Table -AutoSize Path, LineNumber, Line
            Write-Host "::warning::Ditemukan $($violations.Count) pola khusus Windows pada berkas yang belum dimigrasi. Gunakan lapisan OpenForensic.Platform.psm1."
          } else {
            Write-Host 'Bersih: berkas sisa juga tidak memakai pola khusus Windows.'
          }

      - name: Guard - script POSIX harus LF (blocking)
        shell: powershell
        run: |
          $bad = @()
          foreach ($file in @('setup_tools.sh', 'openforensic.sh', 'Dockerfile')) {
            if (-not (Test-Path -LiteralPath $file)) { continue }
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $file).Path)
            if ($bytes -contains 13) { $bad += $file }
          }
          if ($bad.Count -gt 0) { throw "Berkas berikut memakai CRLF dan akan gagal di Linux/macOS: $($bad -join ', ')" }
          Write-Host 'Bersih: seluruh script POSIX memakai LF.'

      - name: Guard - installer POSIX harus lolos sintaks bash
        shell: bash
        run: |
          bash -n setup_tools.sh
          bash -n openforensic.sh
          echo 'Bersih: sintaks bash valid.'
